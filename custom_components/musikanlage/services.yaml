route:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: musikanlage
    zones:
      required: true
      example: ["bar", "zimmer_1"]
      selector:
        object:
    source:
      required: true
      example: "mixer:bar_line_in"
      selector:
        text:
    input:
      example: "pc"
      selector:
        text:
    preset:
      default: normal
      selector:
        select:
          options: [normal, lauter, party]
    mic:
      default: true
      selector:
        boolean:
    dry_run:
      default: false
      selector:
        boolean:
